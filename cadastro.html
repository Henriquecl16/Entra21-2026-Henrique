<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Cadastro de Clientes</h1>

        <div class="form-group">
            <label>Nome</label>
            <input type="text" id="nome" placeholder="Ex:Ribamar">
            <small id="erroNome" class="erro"></small>
        </div>

        <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="email" placeholder="Ribamar@gmail.com">
            <small id="erroEmail" class="erro"></small>
        </div>

        <div class="form-group">
            <label>Telefone</label>
            <input type="text" id="telefone" placeholder="(47) 9999-9999">
            <small id="erroTelefone" class="erro"></small>
        </div>

        <button onclick="cadastrarCliente()">
            Cadastrar
        </button>
        

        <a href="clientes.html">
            <button type="button">
                Ver Clientes
            </button>
        </a>
    <p id="mensagem"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
